<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thando's Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #333333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #666666;
            font-size: 14px;
            line-height: 1.5;
        }

        h3 {
            color: #333333;
            margin-top: 20px;
            font-size: 18px;
        }

        ul {
            padding-left: 20px;
            color: #555555;
        }

        li {
            margin-bottom: 8px;
        }

        img {
            width: 100%;
            border-radius: 8px;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>welcome to my workspace</h1>
        <p>Hello! I'm Thando, a passionate web developer with a love for creating beautiful and functional websites and applications.</p>
        
        <!-- working image from unsplash -->
        <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=800" alt="Coding setup">

        <h3>my favourite Tech stack</h3>
        <ul>
            <li>HTML, CSS, JavaScript</li>
            <li>React, Node.js</li>
            <li>Responsive Design</li>
            <li>Version Control (Git)</li>
        </ul>

        <a href="https://github.com" class="btn">Visit My Portfolio</a>
    </div>

</body>
</html>
